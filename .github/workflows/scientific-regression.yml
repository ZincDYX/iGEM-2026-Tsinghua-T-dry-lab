name: Scientific contracts and installed wheel
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            numpy: 'numpy==1.24.4'
            scipy: 'scipy==1.12.0'
          - python: '3.13'
            numpy: 'numpy>=2'
            scipy: 'scipy>=1.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared numerical floor or current range
        run: python -m pip install '.[test,software]' '${{ matrix.numpy }}' '${{ matrix.scipy }}'
      - name: Scientific and workflow regressions
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and smoke outside source checkout
        run: |
          python -m venv /tmp/igem-wheel-smoke
          /tmp/igem-wheel-smoke/bin/python -m pip install dist/*.whl '${{ matrix.numpy }}' '${{ matrix.scipy }}'
          cp scripts/smoke_installed_package.py /tmp/igem-wheel-smoke.py
          cd /tmp
          /tmp/igem-wheel-smoke/bin/python /tmp/igem-wheel-smoke.py

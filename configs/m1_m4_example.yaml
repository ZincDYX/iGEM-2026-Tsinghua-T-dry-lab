run:
  id: m1-m4-demo
  output_dir: outputs
  random_seed: 42

execution:
  mode: demo
  require_provenance: true
  allow_assumptions: true

inputs:
  protein_fasta: ../examples/data/proteins.fasta
  idr_id: IDR
  ligands:
    - id: vestitol
      name: Vestitol
      role: DMT substrate placeholder
      sdf: null
    - id: omo_preglabridin
      name: 4-O-methylpreglabridin
      role: OC/DMT intermediate placeholder
      sdf: null
  enzymes:
    - id: OC
      protein_id: OC
      reaction_role: oxidative cyclase
    - id: DMT
      protein_id: DMT
      reaction_role: demethylation-related enzyme
  scaffolds:
    - id: FTH1
      description: Ferritin 24-mer scaffold placeholder
      oligomeric_state: 24
    - id: SpyTag_SpyCatcher
      description: SpyTag/SpyCatcher assembly scaffold placeholder
      oligomeric_state: 1
  linkers:
    - id: pgl3_3x_ggggs
      sequence: GGGGSGGGGSGGGGS
      source: Kuroiwa et al. EMBO Reports 2026, PGL-3(D1-D2-3(GGGGS)-RGG), Addgene 250141
  constructs:
    - id: FTH1-pgl3_3x_ggggs
      components: [FTH1, IDR, pgl3_3x_ggggs]
      domain_order: [FTH1, linker, IDR]
      fusion_orientation: C_terminal_scaffold_appendage
      linker_ids: [pgl3_3x_ggggs]
      scaffold_id: FTH1
    - id: SpyTag_SpyCatcher-pgl3_3x_ggggs
      components: [SpyTag_SpyCatcher, IDR, pgl3_3x_ggggs]
      linker_ids: [pgl3_3x_ggggs]
      scaffold_id: SpyTag_SpyCatcher

tools:
  colabfold:
    enabled: true
    mode: mock
    command: colabfold_batch {input_file} {output_dir} --model-type alphafold2_multimer
  freesasa:
    enabled: true
    mode: mock
    command: freesasa --format=json {pdb_file}
  autodock_vina:
    enabled: true
    mode: mock
    command: vina --config {config_file} --out {output_dir}/vina_out.pdbqt
# SignalP/DeepTMHMM are optional M0 checks for the OC N-terminus.  They are not
# default pipeline dependencies because their local deployment/access route is
# environment-specific.

stages:
  m1_llps:
    top_n: 6
  m2_fusion:
    activity_penalty_weight: 0.35
    clash_penalty_weight: 0.25
  m3_concentration:
    binding_model: independent
  m4_reaction:
    target_product: glabridin

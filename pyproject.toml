[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-drylab-2026"
version = "0.1.0"
description = "Quantitative structure and condensate-kinetics models for iGEM 2026 Tsinghua-T"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.12",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "requests>=2.31",
  "mcp>=2,<3",
  "biopython>=1.83",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "pandas>=2.0"]
sasa = ["freesasa>=2.2"]
sequence-descriptors = ["localcider==0.1.21"]
sampling = ["pymbar==4.0.3", "numexpr==2.14.2"]
qm = ["pyscf==2.14.0", "geometric==1.1.1"]
qm-preparation = ["rdkit==2025.9.3"]
official-forms = ["playwright==1.63.0"]
docking = ["vina>=1.2.7", "meeko>=0.7"]
test = ["pytest>=7.4", "httpx>=0.27", "setuptools>=77"]
software = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "Pillow>=11.3,<13", "ihm==2.11", "msgpack==1.2.3"]

[project.scripts]
fusionlab = "igem_drylab.software.cli:app"
igem-drylab = "igem_drylab.cli:app"
igem-drylab-mcp = "igem_drylab.mcp.server:main"
igem-vina = "igem_drylab.vina_runner:main"
igem-freesasa = "igem_drylab.freesasa_runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "scientific_algorithm: independent software mathematical or physical oracle",
  "data_contract: applicability, identity, approval, provenance and censoring",
  "integration: actual cross-component or protocol behavior; mock scope declared",
  "platform: process, storage, recovery or isolation behavior",
  "smoke: software entry and artifact shape only",
  "ui: HTTP and source rendering public behavior",
  "reference_reproduction: immutable author-native regression, not complete paper validation",
  "regression: retained legacy software regression not yet individually risk-classified",
]

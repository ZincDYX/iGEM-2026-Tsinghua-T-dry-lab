[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-drylab-2026"
version = "0.1.0"
description = "Quantitative structure and condensate-kinetics models for iGEM 2026 Tsinghua-T"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "requests>=2.31",
  "mcp>=2,<3",
  "biopython>=1.83",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "pandas>=2.0"]
sasa = ["freesasa>=2.2"]
docking = ["vina>=1.2.7", "meeko>=0.7"]
test = ["pytest>=7.4", "httpx>=0.27"]
software = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
igem-drylab = "igem_drylab.cli:app"
igem-drylab-mcp = "igem_drylab.mcp.server:main"
igem-vina = "igem_drylab.vina_runner:main"
igem-freesasa = "igem_drylab.freesasa_runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
